[assets]
directory = "data/evaluation"

[health]
split = "val"
target_tokens = 2000000
output_file = "data/evaluation/paloma_health.jsonl"
tokenizer_path = "assets/hf/Mistral-7B-v0.1"

[statistics]
dataset_repo = "allenai/paloma"
dataset_revision = "PALOMA_REVISION_REQUIRED"
split = "test"
max_sequence_length = 2048
batch_size = 2
dtype = "bfloat16"

[general]
framework_root = "third_party/olmo-eval"
tasks = ["olmobase:easy:qa:rc"]
max_length = 2048
