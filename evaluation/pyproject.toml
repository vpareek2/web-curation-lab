[project]
name = "web-curation-eval"
version = "0.1.0"
description = "Reproducible Paloma statistics and OLMo Eval benchmarks for Web Curation Lab"
requires-python = ">=3.10,<3.11"
dependencies = [
    "datasets>=3,<4",
    "huggingface-hub>=0.30,<1",
    "numpy>=1.26,<3",
    "safetensors>=0.5,<1",
    "tokenizers>=0.21,<1",
    "tomli>=2.2,<3; python_version < '3.11'",
    "torch>=2.3,<3",
    "transformers>=4.51,<5",
]

[project.scripts]
web-curation-eval = "web_curation_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_curation_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
