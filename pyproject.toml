[project]
name = "web-curation-lab"
version = "0.1.0"
description = "Progressive web-data curation experiments for small language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "huggingface-hub",
    "torchtitan",
]

[project.scripts]
web-curation-data = "web_curation_lab.pipeline.cli:main"
web-curation-package-hf = "web_curation_lab.evaluation.hf_package:main"
web-curation-check-hf-parity = "web_curation_lab.evaluation.hf_parity:main"

[project.optional-dependencies]
data = [
    "datatrove[io]",
    "tokenizers>=0.15.0",
]
eval-preflight = [
    "transformers>=5,<6",
]
hybrid = [
    "flash-linear-attention==0.5.2",
    "kernels==0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv.sources]
datatrove = { path = "third_party/datatrove", editable = true }
torchtitan = { path = "third_party/torchtitan", editable = true }

[tool.uv]
conflicts = [
    [
        { extra = "data" },
        { extra = "eval-preflight" },
    ],
    [
        { extra = "data" },
        { extra = "hybrid" },
    ],
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_curation_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
